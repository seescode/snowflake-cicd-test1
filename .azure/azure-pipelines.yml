trigger:
  branches:
    include:
      - "*"

pr:
  branches:
    include:
      - main
      - test

pool:
  vmImage: ubuntu-latest

# ---------------------------------------------------------------------------
# Stage overview:
#   CI        – every branch push and every PR to main/test
#   CD_Test   – merge to `test` branch only  (approval gate on snowflake-test env)
#   CD_Prod   – merge to `main` branch only  (approval gate on snowflake-prod env)
#
# Approval gates are configured in ADO under Pipelines > Environments.
# Create environments named "snowflake-test" and "snowflake-prod", then add
# the required approvers under each environment's Approvals and checks settings.
# ---------------------------------------------------------------------------

stages:

# ===========================================================================
# CI: deploy to isolated dev schema and run all tests
# ===========================================================================
  - stage: CI
    displayName: "CI – deploy to dev schema and test"
    variables:
      - group: snowflake-dev   # ADO variable group – see Feature 8 for required secrets
    jobs:
      - job: CI
        displayName: "Deploy + smoke test + dbt"
        steps:

          - script: pip install snowflake-cli dbt-snowflake
            displayName: "Install Snowflake CLI and dbt"

          # Write the RSA private key from the ADO secret variable to a temp file.
          # Store the full key content (including header/footer) in the
          # SNOWFLAKE_PRIVATE_KEY secret variable of the snowflake-dev variable group.
          - script: |
              printf '%s' "$(SNOWFLAKE_PRIVATE_KEY)" | sed 's/\\n/\n/g' > /tmp/rsa_key.p8
              chmod 600 /tmp/rsa_key.p8
              echo "##vso[task.setvariable variable=SNOWFLAKE_PRIVATE_KEY_PATH]/tmp/rsa_key.p8"
            displayName: "Write private key to temp file"

          - script: |
              mkdir -p ~/.snowflake
              {
                echo '[connections.default]'
                echo "account = \"${SNOWFLAKE_ACCOUNT}\""
                echo "user = \"${SNOWFLAKE_USER}\""
                echo "private_key_path = \"${SNOWFLAKE_PRIVATE_KEY_PATH}\""
                echo "role = \"${SNOWFLAKE_ROLE}\""
                echo "database = \"${SNOWFLAKE_DATABASE}\""
                echo "schema = \"${SNOWFLAKE_SCHEMA}\""
                echo "warehouse = \"${SNOWFLAKE_WAREHOUSE}\""
                echo 'authenticator = "snowflake_jwt"'
              } > ~/.snowflake/config.toml
              chmod 600 ~/.snowflake/config.toml
            displayName: "Configure Snowflake CLI connection"
            env:
              SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
              SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
              SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
              SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
              SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
              SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
              SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)

          # Derive the isolated dev schema name from the committer's email prefix.
          # e.g. john.doe@company.com  =>  JOHN_DOE
          # - script: |
          #     SCHEMA=$(echo "$(Build.RequestedForEmail)" \
          #       | cut -d@ -f1 \
          #       | tr '[:lower:]' '[:upper:]' \
          #       | sed 's/[^A-Z0-9]/_/g')
          #     echo "Dev schema: $SCHEMA"
          #     echo "##vso[task.setvariable variable=SNOWFLAKE_SCHEMA]$SCHEMA"
          #   displayName: "Derive dev schema from committer email"

          - script: bash scripts/deploy.sh
            displayName: "Deploy Snowflake objects (tables → views → stored procs)"
            env:
              SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
              SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
              SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
              SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
              SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
              SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
              SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)

          - script: snow sql -f scripts/smoke_test.sql
            displayName: "Run smoke tests"
            env:
              SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
              SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
              SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
              SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
              SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
              SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
              SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)

          - script: dbt run --profiles-dir dbt --project-dir dbt
            displayName: "dbt run"
            env:
              SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
              SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
              SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
              SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
              SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
              SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
              SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)
              DBT_TARGET:                 dev

          - script: dbt test --profiles-dir dbt --project-dir dbt
            displayName: "dbt test"
            env:
              SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
              SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
              SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
              SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
              SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
              SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
              SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)
              DBT_TARGET:                 dev

# ===========================================================================
# CD – Test environment (merge to `test` branch only)
# ===========================================================================
  - stage: CD_Test
    displayName: "CD – deploy to test environment"
    dependsOn: CI
    condition: |
      and(
        succeeded('CI'),
        eq(variables['Build.SourceBranch'], 'refs/heads/test')
      )
    variables:
      - group: snowflake-test
    jobs:
      - deployment: Deploy_Test
        displayName: "Deploy to test"
        environment: snowflake-test   # approval gate configured in ADO Environments UI
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: pip install snowflake-cli dbt-snowflake
                  displayName: "Install Snowflake CLI and dbt"

                - script: |
                    printf '%s' "$(SNOWFLAKE_PRIVATE_KEY)" | sed 's/\\n/\n/g' > /tmp/rsa_key.p8
                    chmod 600 /tmp/rsa_key.p8
                    echo "##vso[task.setvariable variable=SNOWFLAKE_PRIVATE_KEY_PATH]/tmp/rsa_key.p8"
                  displayName: "Write private key to temp file"

                - script: |
                    mkdir -p ~/.snowflake
                    {
                      echo '[connections.default]'
                      echo "account = \"${SNOWFLAKE_ACCOUNT}\""
                      echo "user = \"${SNOWFLAKE_USER}\""
                      echo "private_key_path = \"${SNOWFLAKE_PRIVATE_KEY_PATH}\""
                      echo "role = \"${SNOWFLAKE_ROLE}\""
                      echo "database = \"${SNOWFLAKE_DATABASE}\""
                      echo "schema = \"${SNOWFLAKE_SCHEMA}\""
                      echo "warehouse = \"${SNOWFLAKE_WAREHOUSE}\""
                      echo 'authenticator = "snowflake_jwt"'
                    } > ~/.snowflake/config.toml
                    chmod 600 ~/.snowflake/config.toml
                  displayName: "Configure Snowflake CLI connection"
                  env:
                    SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
                    SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
                    SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
                    SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
                    SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
                    SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
                    SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)

                - script: bash scripts/deploy.sh
                  displayName: "Deploy Snowflake objects (tables → views → stored procs)"
                  env:
                    SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
                    SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
                    SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
                    SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
                    SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
                    SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
                    SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)

                - script: dbt run --profiles-dir dbt --project-dir dbt
                  displayName: "dbt run"
                  env:
                    SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
                    SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
                    SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
                    SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
                    SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
                    SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
                    SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)
                    DBT_TARGET:                 test

                - script: dbt test --profiles-dir dbt --project-dir dbt
                  displayName: "dbt test"
                  env:
                    SNOWFLAKE_ACCOUNT:          $(SNOWFLAKE_ACCOUNT)
                    SNOWFLAKE_USER:             $(SNOWFLAKE_USER)
                    SNOWFLAKE_PRIVATE_KEY_PATH: $(SNOWFLAKE_PRIVATE_KEY_PATH)
                    SNOWFLAKE_ROLE:             $(SNOWFLAKE_ROLE)
                    SNOWFLAKE_DATABASE:         $(SNOWFLAKE_DATABASE)
                    SNOWFLAKE_SCHEMA:           $(SNOWFLAKE_SCHEMA)
                    SNOWFLAKE_WAREHOUSE:        $(SNOWFLAKE_WAREHOUSE)
                    DBT_TARGET:                 test

# ===========================================================================
# CD – Prod environment (merge to `main` branch only)
# ===========================================================================
  - stage: CD_Prod
    displayName: "CD – deploy to prod environment"
    dependsOn: CI
    condition: |
      and(
        succeeded('CI'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
