definition-version: "2"

# Project-level variables resolved from environment at deploy time.
# In CI these are injected by ADO variable groups.
# For local development copy config.toml.example to ~/.snowflake/config.toml.
env:
  database:  <% ctx.env.SNOWFLAKE_DATABASE %>
  schema:    <% ctx.env.SNOWFLAKE_SCHEMA %>
  role:      <% ctx.env.SNOWFLAKE_ROLE %>
  warehouse: <% ctx.env.SNOWFLAKE_WAREHOUSE %>
  account:   <% ctx.env.SNOWFLAKE_ACCOUNT %>
  user:      <% ctx.env.SNOWFLAKE_USER %>
