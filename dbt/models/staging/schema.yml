version: 2

models:
  - name: stg_members
    columns:
      - name: member_id
        tests:
          - not_null
          - unique
      - name: first_name
        tests:
          - not_null
      - name: last_name
        tests:
          - not_null
      - name: plan_type
        tests:
          - not_null
          - accepted_values:
              values: ['HMO', 'PPO', 'EPO']
      - name: effective_date
        tests:
          - not_null

  - name: stg_providers
    columns:
      - name: provider_id
        tests:
          - not_null
          - unique
      - name: npi_number
        tests:
          - not_null
          - unique
      - name: network_status
        tests:
          - not_null
          - accepted_values:
              values: ['IN_NETWORK', 'OUT_OF_NETWORK']

  - name: stg_claims
    columns:
      - name: claim_id
        tests:
          - not_null
          - unique
      - name: member_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_members')
              field: member_id
      - name: provider_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_providers')
              field: provider_id
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['PENDING', 'APPROVED', 'DENIED', 'PAID']
      - name: amount_billed
        tests:
          - not_null
