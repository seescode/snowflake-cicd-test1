version: 2

models:
  - name: mart_claims_summary
    columns:
      - name: claim_id
        tests:
          - not_null
          - unique
      - name: member_id
        tests:
          - not_null
      - name: provider_id
        tests:
          - not_null
      - name: claim_status
        tests:
          - not_null
          - accepted_values:
              values: ['PENDING', 'APPROVED', 'DENIED', 'PAID']
      - name: plan_type
        tests:
          - not_null
          - accepted_values:
              values: ['HMO', 'PPO', 'EPO']
      - name: network_status
        tests:
          - not_null
          - accepted_values:
              values: ['IN_NETWORK', 'OUT_OF_NETWORK']
